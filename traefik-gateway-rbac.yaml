apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-gateway-controller
rules:
  # Gateway API resources
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - udproutes
      - referencegrants
    verbs: ["get", "list", "watch", "update", "patch"]

  # Core resources needed by controller
  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - endpoints
      - secrets
    verbs: ["get", "list", "watch"]

  # Optional: deployments if needed
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-gateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-gateway-controller
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: kube-system

