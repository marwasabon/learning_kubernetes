
<header class='mb-3'>
	<nav
		class="navbar navbar-expand bg-white navbar-light navbar-top shadow-sm">
		<div class="container-fluid">
			<a href="#" class="burger-btn d-block"> <i
				class="bi bi-justify fs-4"></i>
			</a>

			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav ms-auto mb-lg-0">



				</ul>
				<div class="dropdown">
					<a href="#" data-bs-toggle="dropdown" aria-expanded="false">
						<div class="user-menu d-flex align-items-center">
							<div class="user-name text-end me-2">
								<h6 class="mb-0 text-gray-600"
									th:text="${#authentication.getPrincipal().getUsername().toUpperCase()}"></h6>
								<p class="mb-0 text-gray-600"></p>
							</div>
							<div class="user-img d-flex align-items-center">
								<div class="avatar bg-warning border border-2 border-light"
									th:classappend="'bg-' + ${#authentication.getPrincipal().getUsername().toLowerCase()[0]}">
									<span class="avatar-content"
										th:text="${#authentication.getPrincipal().getUsername().toUpperCase()[0]}"></span>
								</div>
							</div>
						</div>
					</a>
					<ul class="dropdown-menu dropdown-menu-end"
						aria-labelledby="dropdownMenuButton" style="min-width: 11rem;">
						<li>
							<h6 class="dropdown-header">
								Hello, <span
									th:text="${#authentication.getPrincipal().getUsername()}"></span>
							</h6>
						</li>
					
						<li><a
							sec:authorize="hasAnyAuthority('Manager','TeamLeader','Director','Officer')"
							class="dropdown-item" th:href="@{/team-profile}"> <i
								class="icon-mid bi bi-person me-2"></i> Team Profile
						</a></li>


						<li>
							<hr class="dropdown-divider">
						</li>
						<li><a class="dropdown-item" th:href="@{/logout}"><i
								class="icon-mid bi bi-box-arrow-left me-2"></i> Logout</a></li>
					</ul>
				</div>
			</div>
		</div>
	</nav>
</header>

<th:block th:if="${success}">

	<!-- success toast -->
	<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
		<div class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="toast-header">
				<!-- <img src="" class="rounded me-2" alt="..."> -->
				<strong class="me-auto">
					<span class="rounded-circle text-center text-success">
						<span class="fa fa-check-circle"></span>
					</span>
					Success
				</strong>
				<small>Just now</small>
				<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
			</div>
			<div class="toast-body">
				<span th:text="${success}"></span>
			</div>
		</div>
	</div>

</th:block>

<th:block th:if="${failure}">

	<!-- failure toast -->
	<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
		<div class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="toast-header">
				<!-- <img src="" class="rounded me-2" alt="..."> -->
				<strong class="me-auto">
					<span class="rounded-circle text-center text-danger">
						<span class="fa fa-exclamation-circle"></span>
					</span>
					Error
				</strong>
				<small>Just now</small>
				<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
			</div>
			<div class="toast-body">
				<span th:text="${failure}"></span>
			</div>
		</div>
	</div>

</th:block>
