<script>

	$(document).ready(function () {
		var currentDate = new Date();
		var currentMonth = currentDate.toLocaleString('default', {month: 'long'});

		// Update the heading text with the current month
		var currentMonthHeading = document.getElementById('currentMonthHeading');
		currentMonthHeading.innerHTML = 'All ShortCodes in ' + currentMonth;


		// Make aaa GET request to the /allsss endpoint
		fetch('/shortcodes/allBymonth')
			.then(response => response.json())
			.then(data => {
				// Update the content of the cards with the retrieved data
				const priceCard = document.querySelector('.info-box:nth-child(1) .big');
				const articlesCard = document.querySelector('.info-box:nth-child(2) .big');
				const executivesCard = document.querySelector('.info-box:nth-child(3) .big');
				// Iterate over the data array and update the card content accordingly
				data.forEach(entry => {
					const status = entry[0];
					const count = entry[1];

					if (status === "Disconnect" || status === "DISCONNECT") {
						priceCard.textContent = status + ', ' + count;
					}
					else if (status === "New" || status === "new") {
						articlesCard.textContent = status + ', ' + count;;

					} else if (status === "Renewal" || status === "Renew") {
						executivesCard.textContent = status + ', ' + count;;
					}
				});

				//	conversationsCard.textContent = data[3][1];
			})

			.catch(error => {
				console.error('Error:', error);
			});
	});

	function validateDates() {
		var fromDate = document.getElementById("from").value;
		var toDate = document.getElementById("datepickerTo").value;
		var selection = document.getElementById("filterOptionsID").value;

		if (fromDate === "" || toDate === "" || selection === "") {

			//var errorAlert = document.getElementById("errorAlert");
			//errorAlert.style.display = "block";
			//toastr.failure("Please choose a date and selection.");
			var errorToastContainer = document.getElementById("errorToastContainer");
			var errorToastMessage = document.getElementById("errorToastMessage");

			document.getElementById("errorMessage").textContent = "Please choose a date and selection.";
			var errorModal = new bootstrap.Modal(document.getElementById("errorModal"));
			errorModal.show();

			return false;
		}

		var fromDate = new Date(document.getElementById("datepicker").value);
		var toDate = new Date(document.getElementById("datepickerTo").value);

		if (toDate.getTime() <= fromDate.getTime()) {
			//alert("To date must be older than from date.");
			document.getElementById("errorMessage").textContent = "To date must be older than from date.";
			var errorModal = new bootstrap.Modal(document.getElementById("errorModal"));
			errorModal.show();
			return false;
		} else {
			filter();
			return true;
		}

	}

	function validateField(fieldId, errorMessage) {
		var field = document.getElementById(fieldId);
		var value = field.value.trim();

		if (value === "") {
			field.setAttribute("class", "form-control is-invalid");
			field.nextElementSibling.innerHTML = errorMessage;
			return false;
		} else {
			field.setAttribute("class", "form-control is-valid");
			field.nextElementSibling.innerHTML = "";
			return true;
		}
	}
