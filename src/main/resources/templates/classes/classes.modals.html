<!--Add Modal -->

<div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel" aria-hidden="true">
    <form th:action="@{/classes/saveClass}" th:object="${classe}" id ="addform" method="POST">

        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Add new Class 
                    </h5>
         	          
				<button type="button" id="closenewModal" class="close closefirstmodal">
					<span aria-hidden="true">&times;</span>
				</button>
                </div>
                <div class="modal-body">


                    <div class="form-group" hidden>
                        <label for="recipient-name" class="col-form-label">Class
                            ID
                        </label>
                        <input type="text" class="form-control" id="classID" name="classID">
                    </div>

            

                    <div class="form-group">
                        <label for="message-text" class="col-form-label">Class Name
                        </label>
                        <input  type="text"  class="form-control" id="class_name" name="className" required></input>
                    </div>

                    
                <div class="modal-footer">
					<button type="button" class="btn btn-sm btn-secondary" id= "closenewModal3">Close</button>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                </div>

            </div>
        </div>
        </div>
    </form>

</div>
<!--  add Modal -->

<!--Edit Modal -->

<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
    <form th:action="@{/classes/updateClass}" th:object="${classe}" method="POST">

        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Class
                    </h5>
                    
                    <button type="button" id="closeEditModal2" class="close closefirstmodal2">
					<span aria-hidden="true">&times;</span>
				</button>
                </div>
				<div class="modal-body">


					<div class="form-group" hidden>
						<label for="recipient-name" class="col-form-label">Class
							ID </label> <input type="text" class="form-control" id="classIDEdit"
							name="classID">
					</div>
					<div class="form-group">
						<label for="message-text" class="col-form-label">Class
							Name</label>
						<input type="text" class="form-control" id="classNameEdit" name="className" required></input>
					</div>


				</div>

				<div class="modal-footer">
					<button type="button" class="btn btn-sm btn-secondary" id= "closenewModal4">Close</button>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                </div>

            </div>
        </div>
    </form>

</div>

<!-- delete modal-->

<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel"
    aria-hidden="true">

    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete Class 
                </h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="container">
                <p>Are you sure you want to delete this Class?</p>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <a href="" class="btn btn-sm btn-danger" id="delRef">Delete</a>
                </div>
            </div>
        </div>
    </div>

</div>
