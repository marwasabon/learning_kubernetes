<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortCode</title>
    <link rel="stylesheet" href="/assets/css/main/app.css" />
    <link rel="stylesheet" href="/assets/css/pages/auth.css" />
    <link
      rel="shortcut icon"
      href="/assets/images/logo/favicon.svg"
      type="image/x-icon"
    />
    <link
      rel="shortcut icon"
      href="/assets/images/logo/favicon.png"
      type="image/png"
    />
  </head>

  <body>
    <div id="auth">
      <div class="row h-100">
        <div class="col-lg-5 col-12">
          <div id="auth-left">
            <div class="auth-logo">
              <a href="index.html"
                ><img src="/assets/images/logo/zain.svg" alt="Zain Logo"
              /></a>
            </div>
            <h1 class="auth-title">Short-Code System</h1>
            <p class="auth-subtitle mb-5">
              Welcome! Please login to your account.
            </p>

            <form method="POST" th:action="@{/login}" id="siginForm">
              <div class="form-group position-relative has-icon-left mb-4">
                <input
                  class="form-control rounded-pill border-0"
                  type="text"
                  name="username"
                  id="username"
                  autocomplete="off"
                  placeholder="Enter username"
                  data-error=""
                  autofocus="true"
                  required="true"
                />

                <div class="form-control-icon">
                  <i class="bi bi-person"></i>
                </div>
              </div>
              <div class="form-group position-relative has-icon-left mb-4">
                <input
                  class="form-control rounded-pill border-0"
                  type="password"
                  name="password"
                  id="password"
                  autocomplete="off"
                  placeholder="Enter password"
                  data-error=""
                  required="true"
                />

                <div class="form-control-icon">
                  <i class="bi bi-shield-lock"></i>
                </div>
              </div>

              <p th:if="${param.error}">
                <span class="alert alert-danger"
                  >Invalid username or password.</span
                >
              </p>

              <button
                class="btn btn-primary py-3 bg-gradient-zain btn-block btn-lg border-0 rounded-pill mt-3 fs-6"
                id="submit"
                type="submit"
              >
                Login
              </button>
            </form>
          </div>
        </div>
        <div class="col-lg-7 d-none d-lg-block">
          <div id="auth-right"></div>
        </div>
      </div>
    </div>
  </body>
</html>
