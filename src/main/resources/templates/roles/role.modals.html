<!--Add Modal -->

<div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel" aria-hidden="true">
    <form th:action="@{/roles/saveRole}" th:object="${Role}" method="POST">

        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Add new Role 
                    </h5>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">

            

                    <div class="form-group">
                        <label for="message-text" class="col-form-label">Role Name
                        </label>
                        <input type="text" class="form-control" id="RoleName" name="name" required></input>
                    </div>

                       <div class="form-group">
                        <label for="message-text" class="col-form-label">Role Code
                        </label>
                        <input type="text" class="form-control" id="RoleCode" name="code" required></input>
                    </div>
                    
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                </div>

            </div>
        </div>
        </div>
    </form>

</div>
<!--  add Modal -->

<!--Edit Modal -->

<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
    <form th:action="@{/roles/updateRole}" th:object="${Role}" method="POST">

        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Role
                    </h5>
                    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
				<div class="modal-body">


					<div class="form-group" hidden>
						<label for="recipient-name" class="col-form-label">Role
							ID </label> <input type="text" class="form-control" id="RoleIDEdit"
							name="id">
					</div>
					<div class="form-group">
						<label for="message-text" class="col-form-label">Role
							Name</label>
						<input type="text" class="form-control" id="RoleNameEdit" name="name" required></input>
					</div>
						<div class="form-group">
						<label for="message-text" class="col-form-label">Role Code</label>
						<input type="text" class="form-control" id="RoleCodeEdit" name="code" required></input>
					</div>



				</div>

				<div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-sm btn-primary">Save</button>
                </div>

            </div>
        </div>
    </form>

</div>
<!--  edit Modal -->

<!-- delete modal-->

<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModalLabel"
    aria-hidden="true">

    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete Role 
                </h5>
                <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="container">
                <p>Are you sure you want to delete this Role?</p>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <a href="" class="btn btn-sm btn-danger" id="delRef">Delete</a>
                </div>
            </div>
        </div>
    </div>

</div>
<!--delete modal -->
