<!--Add Modal -->

<div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel" aria-hidden="true">
	<form th:action="@{/routingMSISDNs/saveRoutingMSISDNs(shortcodeID=${shortcodeID})}" th:object="${RoutingMSISDNs}"
		method="POST" id="routing-form">

		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="addModalLabel">Add new RoutingMSISDNs
					</h5>
					<button type="button" id="closenewModal" class="close closefirstmodal">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">


					<div class="form-group" hidden>
						<label for="recipient-name" class="col-form-label">RoutingMSISDNs
							ID
						</label>
						<input type="text" class="form-control" id="routingMSISDNssID" name="routingMSISDNsID">
					</div>



					<div class="form-group">
						<label for="message-text" class="col-form-label">RoutingMSISDNs Number
						</label>
						<input type="text" class="form-control" id="routingMSISDN" name="routingMSISDN" required
							onblur="validaterouting('routingMSISDN', 'RoutingMSISDN must only by numbers ')"></input>
						<span class="invalid-feedback"></span>

					</div>
					<div class="alert alert-danger d-none" id="error-message">

					</div>

					<div class="modal-footer">
						<button type="button" class="btn btn-sm btn-secondary" id="closenewModal3">Close</button>
						<button type="submit" class="btn btn-sm btn-primary">Save</button>
					</div>

				</div>
			</div>
		</div>
	</form>

</div>
<!--  add Modal -->

<!--Edit Modal -->

					</h5>

					<button type="button" id="closeEditModal2" class="close closefirstmodal2">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">


					<div class="form-group" hidden>
						<label for="recipient-name" class="col-form-label">RoutingMSISDNs
							ID </label> <input type="text" class="form-control" id="RoutingMSISDNsIDEdit"
							name="routingMSISDNID">
					</div>
					<div class="form-group">
						<label for="message-text" class="col-form-label">RoutingMSISDNs

					<div class="modal-footer">

				</div>
			</div>

	</form>

</div>
